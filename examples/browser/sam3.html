<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAM3 browser example</title>
    <script>
      window.coi = {
        coepCredentialless: true,
      };
    </script>
    <script src="./coi-serviceworker.min.js"></script>
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: #172033;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      main {
        display: flex;
        height: 100vh;
        flex-direction: column;
        box-sizing: border-box;
        padding: 18px;
        background: #fff;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      .title-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .demo-nav {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid #d8dee9;
        border-radius: 999px;
      }

      .demo-nav a {
        padding: 5px 12px;
        color: #344054;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        background: #fff;
      }

      .demo-nav a.is-active {
        color: #fff;
        background: #2563eb;
      }

      .mode-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .mode-badge[data-mode="local"] {
        color: #175cd3;
        background: #eff8ff;
        border: 1px solid #b2ddff;
      }

      .mode-badge[data-mode="pages"] {
        color: #6941c6;
        background: #f9f5ff;
        border: 1px solid #e9d7fe;
      }

      p {
        margin: 6px 0 0;
        color: #667085;
      }

      .panel {
        margin-top: 14px;
        padding: 14px;
        background: #f8fafc;
        border: 1px solid #edf0f5;
        border-radius: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        margin: 0;
        color: #344054;
        font-size: 13px;
        font-weight: 600;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        min-width: 0;
        padding: 9px 10px;
        color: #172033;
        background: #fff;
        border: 1px solid #d8dee9;
        border-radius: 10px;
      }

      input[type="range"] {
        padding: 0;
      }

      .range-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .range-value {
        color: #2563eb;
        font-variant-numeric: tabular-nums;
      }

      button {
        padding: 9px 14px;
        color: #fff;
        cursor: pointer;
        background: #2563eb;
        border: 0;
        border-radius: 10px;
      }

      button:disabled {
        cursor: not-allowed;
        background: #9ca3af;
      }

      canvas {
        display: block;
        width: 100%;
      }

      pre {
        height: 220px;
        margin: 0;
        padding: 12px;
        overflow: auto;
        color: #e5e7eb;
        background: #111827;
        border-radius: 12px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 10px;
        margin-top: 12px;
      }

      .workspace {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 14px;
        margin-top: 14px;
      }

      .preview-panel {
        display: flex;
        flex: 1 1 40%;
        flex-direction: column;
        min-width: 0;
        height: 100%;
      }

      .viewer {
        position: relative;
        align-self: flex-start;
        min-width: 60%;
        overflow: hidden;
        background: #0f172a;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-sizing: border-box;
        flex: none;
        width: 100%;
        max-width: 100%;
        cursor: crosshair;
      }

      .viewer canvas {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: calc(100vh - 426px);
        margin: 0 auto;
        height: auto;
      }

      .hint {
        margin: 8px 0 0;
        color: #667085;
        font-size: 13px;
        font-weight: 400;
      }

      .candidates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgb(15 23 42 / 45%);
        contain: strict;
      }

      .loading-overlay.visible {
        display: grid;
      }

      .loading-card {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: min(320px, 100%);
        padding: 22px;
        color: #f8fafc;
        text-align: center;
        background: rgb(17 24 39 / 92%);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 16px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 35%);
      }

      .loading-spinner {
        width: 34px;
        height: 34px;
        border: 4px solid rgb(255 255 255 / 22%);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }

      .loading-title {
        font-size: 16px;
        font-weight: 700;
      }

      .loading-message {
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.5;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .side {
        display: grid;
        flex: 1 1 280px;
        gap: 12px;
        align-content: start;
        min-width: 280px;
      }

      @media (max-width: 900px) {
        main {
          min-height: 100dvh;
          padding: 12px;
        }

        h1 {
          font-size: 20px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .workspace {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: stretch;
          gap: 12px;
        }

        .preview-panel {
          flex: none;
          width: 100%;
          height: auto;
        }

        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .controls button {
          width: 100%;
        }

        .viewer {
          align-self: stretch;
          width: 100%;
          max-width: 100%;
          flex: none;
        }

        .side {
          flex: none;
          width: 100%;
          min-width: 0;
        }

        pre {
          width: 100%;
          height: 160px;
          box-sizing: border-box;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="title-row">
        <nav class="demo-nav" aria-label="示例切换">
          <a href="./">YOLO</a>
          <a class="is-active" href="./sam3.html">SAM3</a>
        </nav>
        <h1 id="demoTitle">SAM3 交互分割示例</h1>
        <span id="demoModeBadge" class="mode-badge" data-mode="local">本地 npm</span>
      </div>
      <p id="demoDescription">加载 SAM3 ONNX 后，可用文本做概念分割，或用点/框做实例分割并迭代修正。</p>

      <section class="panel">
        <div class="grid">
          <label>
            推理后端
            <select id="backend"></select>
          </label>
          <label>
            任务类型
            <select id="taskMode">
              <option value="pcs">概念分割 PCS（文本 / 范例）</option>
              <option value="pvs">视觉分割 PVS（点 / 框 / 掩码）</option>
            </select>
          </label>
          <label>
            点击极性
            <select id="promptPolarity">
              <option value="positive">正例 / 前景</option>
              <option value="negative">负例 / 背景</option>
            </select>
          </label>
          <label>
            类别名称
            <input id="textPrompt" placeholder="person, car, dog" autocomplete="off" />
          </label>
          <label>
            详细描述
            <input id="textDescription" placeholder="可选，例如 wearing a red hat" autocomplete="off" />
          </label>
          <label>
            SAM3 模型目录
            <input id="modelDirectory" type="file" webkitdirectory directory multiple />
          </label>
          <label>
            视觉编码器
            <input id="visionFile" type="file" accept=".onnx" />
          </label>
          <label>
            文本编码器
            <input id="textFile" type="file" accept=".onnx" />
          </label>
          <label>
            Grounding 解码器
            <input id="groundingFile" type="file" accept=".onnx" />
          </label>
          <label>
            Prompt 解码器
            <input id="promptFile" type="file" accept=".onnx" />
          </label>
          <label>
            Tokenizer
            <input id="tokenizerFile" type="file" accept=".json" />
          </label>
          <label>
            <span class="range-label">置信度 <span id="confidenceValue" class="range-value">0.50</span></span>
            <input id="confidenceInput" type="range" min="0" max="1" step="0.01" value="0.5" />
          </label>
          <label>
            <span class="range-label">结果透明度 <span id="resultOpacityValue" class="range-value">1.00</span></span>
            <input id="resultOpacityInput" type="range" min="0" max="1" step="0.01" value="1" />
          </label>
        </div>
      </section>

      <section class="workspace">
        <div class="preview-panel">
          <label>
            上传图片
            <input id="imageFile" type="file" accept="image/*" />
          </label>

          <div class="controls">
            <button id="loadButton" type="button">加载模型</button>
            <button id="encodeButton" type="button" disabled>编码图像</button>
            <button id="runTextButton" type="button" disabled>文本分割</button>
            <button id="resetButton" type="button" disabled>重置提示</button>
          </div>
          <div id="candidates" class="candidates"></div>
          <p id="hint" class="hint">PCS：类别用逗号分隔，例如 person, car, dog。详细描述可选，用来补充颜色、姿态、场景；查询时会加到每个类别上，标签仍用类别名。</p>

          <div id="viewer" class="viewer">
            <canvas id="preview"></canvas>
          </div>
        </div>

        <div class="side">
          <pre id="modelInfo">等待加载 SAM3 模型...</pre>
          <pre id="output">请选择 SAM3 模型目录，或分别选择 4 个 ONNX 与 clip_bpe.json，再点“加载模型”。优先 fp16 编码器与 WebGPU。</pre>
        </div>
      </section>
    </main>

    <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div id="loadingTitle" class="loading-title">正在加载 SAM3</div>
        <div id="loadingMessage" class="loading-message">正在加载 WASM 与模型，请稍候...</div>
      </div>
    </div>

    <script type="module" src="./sam3.ts"></script>
  </body>
</html>
